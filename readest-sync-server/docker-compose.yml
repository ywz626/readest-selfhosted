# Fixed project name + volume name so the deployment can move (git clone into a
# new directory, renamed repo, `docker compose` run from anywhere) WITHOUT
# orphaning the data volume: the sqlite DB and uploaded books live in
# readest-sync-server_appdata, and an auto-derived project name would silently
# mount a fresh empty one. Never change these two values on a live deployment.
name: readest-sync-server

services:
  app:
    build: .
    env_file: .env            # 读取用户 .env，注入所有变量
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/data     # 持久化 sqlite + 本地文件（命名卷，自动匹配容器用户权限）
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]    # 仅 --profile postgres 时启动
    environment:
      POSTGRES_USER: readest
      POSTGRES_PASSWORD: readest
      POSTGRES_DB: readest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readest"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub 已下架 minio 镜像，改从 quay.io 拉取（与上游 docker/compose.yaml 保持一致）
    image: quay.io/minio/minio:latest
    profiles: ["minio"]       # 仅 --profile minio 时启动
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  appdata:
    # Pinned: this is the existing production volume (4+ GB of sqlite +
    # uploaded books). An auto-derived name would create a second, empty one.
    name: readest-sync-server_appdata
  pgdata:
    name: readest-sync-server_pgdata
  miniodata:
    name: readest-sync-server_miniodata
